          reorderIndicator.style.top = `${rect.top}px`;
          reorderIndicator.style.width = "var(--size-reorder-indicator)";
          reorderIndicator.style.height = `${rect.height}px`;
          reorderIndicator.style.transform = "translateX(-50%)";
        } else {
          reorderIndicator.style.left = `${rect.left}px`;
          reorderIndicator.style.top = `${placeAfter ? rect.bottom : rect.top}px`;
          reorderIndicator.style.width = `${rect.width}px`;
          reorderIndicator.style.height = "var(--size-reorder-indicator)";
          reorderIndicator.style.transform = "translateY(-50%)";
        }
      }

      function updateReorderTarget(clientX, clientY) {
        const images = mediaStrip.children;
        if (!state.reorder || !images.length) return;
        const coordinate = state.orientation === "horizontal" ? clientX : clientY;
        let target = images[images.length - 1];
        let placeAfter = true;
        for (const image of images) {
          const rect = image.getBoundingClientRect();
          const center = state.orientation === "horizontal" ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
          if (coordinate < center) {
            target = image;
            placeAfter = false;
            break;
          }
        }

        state.reorder.targetIndex = Number(target.dataset.index);
        state.reorder.placeAfter = placeAfter;
        if (
          getReorderInsertionIndex(state.reorder.fromIndex, state.reorder.targetIndex, placeAfter) ===
          state.reorder.fromIndex
        ) {
          reorderIndicator.hidden = true;
        } else {
          positionReorderIndicator(target, placeAfter);
        }
      }

      mediaStrip.addEventListener("click", (event) => {
        const image = event.target.closest("img[data-index]");
        if (!image || state.suppressImageClick || document.fullscreenElement || state.readingMode) return;
        openFilePicker("replace", Number(image.dataset.index));
      });

      mediaStrip.addEventListener("pointerdown", (event) => {
        const image = event.target.closest("img[data-index]");
        if (
          state.pinch ||
          !image ||
          event.button !== 0 ||
          !state.images.length ||
          document.fullscreenElement ||
          state.readingMode
        ) {
          return;
        }
        const imageRect = image.getBoundingClientRect();
        const touch = event.pointerType === "touch";
        if (!touch) event.preventDefault();
        const reorder = {
          pointerId: event.pointerId,
          fromIndex: Number(image.dataset.index),
          startX: event.clientX,
          startY: event.clientY,
          targetIndex: Number(image.dataset.index),
          placeAfter: false,
          active: false,
          source: image,
          sourceRect: imageRect,
          deleteDistance: Math.max(1, (state.orientation === "horizontal" ? imageRect.height : imageRect.width) / 2),
          deleteReady: false,
          touch,
          touchScrolling: false,
          translateX: state.translateX,
          translateY: state.translateY,
          lastX: event.clientX,
          lastY: event.clientY,
          lastTime: event.timeStamp,
          velocityX: 0,
          velocityY: 0,
        };
        state.reorder = reorder;
        if (touch) mediaStrip.setPointerCapture(event.pointerId);
      });

      mediaStrip.addEventListener("pointermove", (event) => {
        if (!state.reorder || state.reorder.pointerId !== event.pointerId) return;
        const distance = Math.hypot(event.clientX - state.reorder.startX, event.clientY - state.reorder.startY);
        if (state.reorder.touch && !state.reorder.active) {
          if (!state.reorder.touchScrolling && distance < 6) return;
          if (!state.reorder.touchScrolling) {
            const mainDelta =
              state.orientation === "horizontal"
                ? event.clientX - state.reorder.startX
                : event.clientY - state.reorder.startY;
            const deleteDelta =
              state.orientation === "horizontal"
                ? state.reorder.startY - event.clientY
                : state.reorder.startX - event.clientX;
            if (deleteDelta > 0 && deleteDelta >= Math.abs(mainDelta)) {
              state.reorder.active = true;
              state.reorder.source.classList.add("is-drag-source");
              mediaStrip.classList.add("is-reordering");
            } else {
              state.reorder.touchScrolling = true;
            }
          }
          if (state.reorder.touchScrolling) {
            event.preventDefault();
            const elapsed = Math.max(1, event.timeStamp - state.reorder.lastTime);
            state.reorder.velocityX = (event.clientX - state.reorder.lastX) / elapsed;
            state.reorder.velocityY = (event.clientY - state.reorder.lastY) / elapsed;
            state.reorder.lastX = event.clientX;
            state.reorder.lastY = event.clientY;
            state.reorder.lastTime = event.timeStamp;
            if (state.orientation === "horizontal") {
              state.translateX = state.reorder.translateX + event.clientX - state.reorder.startX;
            } else {
              state.translateY = state.reorder.translateY + event.clientY - state.reorder.startY;
            }
            clampTranslation();
            applyTransform();
            return;
          }
        }
        if (!state.reorder.active) {
          if (distance < 6) return;
          state.reorder.active = true;
          state.reorder.source.classList.add("is-drag-source");
          mediaStrip.classList.add("is-reordering");
          mediaStrip.setPointerCapture(event.pointerId);
        }
        event.preventDefault();
        state.reorder.clientX = event.clientX;
        state.reorder.clientY = event.clientY;
        updateAutoScroll("reorder", event.clientX, event.clientY);
        const inSourceLane =
          state.orientation === "horizontal"
            ? event.clientX >= state.reorder.sourceRect.left && event.clientX <= state.reorder.sourceRect.right
            : event.clientY >= state.reorder.sourceRect.top && event.clientY <= state.reorder.sourceRect.bottom;
        const deleteDragDistance = inSourceLane
          ? Math.max(
              0,
              state.orientation === "horizontal"
                ? state.reorder.startY - event.clientY
                : state.reorder.startX - event.clientX,
            )
          : 0;
        const remainingOpacity = Math.max(0, 1 - deleteDragDistance / state.reorder.deleteDistance);
        state.reorder.source.style.setProperty("--drag-opacity", String(0.55 * remainingOpacity));
        state.reorder.deleteReady = inSourceLane && remainingOpacity === 0;
        if (state.reorder.deleteReady) {
          reorderIndicator.hidden = true;
          positionDeleteIndicator();
        } else {
          deleteIndicator.hidden = true;
          updateReorderTarget(event.clientX, event.clientY);
        }
      });

      function endImageReorder(event, commit) {
        if (!state.reorder || state.reorder.pointerId !== event.pointerId) return;
        const reorder = state.reorder;
        state.reorder = null;
        stopAutoScroll("reorder");
        if (mediaStrip.hasPointerCapture(event.pointerId)) mediaStrip.releasePointerCapture(event.pointerId);
        clearReorderVisuals();
        if (!commit) {
          restoreReorderStart(reorder);
          return;
        }
        if (reorder.touchScrolling) {
          event.preventDefault();
          state.suppressImageClick = true;
          setTimeout(() => {
            state.suppressImageClick = false;
          });
          if (event.timeStamp - reorder.lastTime < 80) {
            startPanMomentum(
              state.orientation === "horizontal" ? reorder.velocityX : 0,
              state.orientation === "vertical" ? reorder.velocityY : 0,
            );
          }
          return;
        }
        if (!reorder.active) return;
        event.preventDefault();
        state.suppressImageClick = true;
        setTimeout(() => {
          state.suppressImageClick = false;
        });
        if (reorder.deleteReady) removeImage(reorder.fromIndex);
        else reorderImage(reorder.fromIndex, reorder.targetIndex, reorder.placeAfter);
      }

      mediaStrip.addEventListener("pointerup", (event) => endImageReorder(event, true));
      window.addEventListener("pointercancel", (event) => endImageReorder(event, false), true);
      mediaStrip.addEventListener("lostpointercapture", (event) => {
        if (state.reorder?.pointerId === event.pointerId) cancelImageReorder();
      });

      document.addEventListener("dragstart", (event) => event.preventDefault());

      workspace.addEventListener("dragover", (event) => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        if (state.readingMode) {
          event.dataTransfer.dropEffect = "none";
          return;
        }
        hideInsertButton();
        const direction = getDropDirection(event.clientX, event.clientY);
        event.dataTransfer.dropEffect = direction ? "copy" : "none";
        showDropIndicator(direction);
        updateAutoScroll("external", event.clientX, event.clientY);
      });

      workspace.addEventListener("drop", async (event) => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        if (state.readingMode) {
          announce("Exit reading mode before adding images.");
          return;
        }
        const direction = getDropDirection(event.clientX, event.clientY);
        stopAutoScroll("external");
        hideDropIndicator();
        if (!direction) {
          announce("Drop beside the images in the current arrangement direction.");
          return;
        }
        await addFiles(event.dataTransfer.files, direction);
      });

      workspace.addEventListener("dragleave", (event) => {
        if (!event.relatedTarget || !workspace.contains(event.relatedTarget)) {
          stopAutoScroll("external");
          hideDropIndicator();
        }
      });

      function endExternalDrag() {
        stopAutoScroll("external");
        hideDropIndicator();
      }

      window.addEventListener("dragend", endExternalDrag);
      window.addEventListener("drop", endExternalDrag);

      window.addEventListener("keydown", (event) => {
        if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
        if (
          event.target instanceof Element &&
          event.target.matches("input, textarea, select, [contenteditable='true']")
        )
          return;
        const key = event.key.toLowerCase();
        if (state.readingMode) {
          let pageDelta = 0;
          if (state.orientation === "horizontal") {
            if (event.key === "ArrowLeft" || key === "a") pageDelta = 1;
            else if (event.key === "ArrowRight" || key === "d") pageDelta = -1;
          } else {
            if (event.key === "ArrowDown" || key === "s") pageDelta = 1;
            else if (event.key === "ArrowUp" || key === "w") pageDelta = -1;
          }
          if (!pageDelta) return;
          event.preventDefault();
          moveReadingPage(pageDelta);
          return;
        }
        if (state.images.length < 2) return;
        let delta = 0;
        if (state.orientation === "horizontal") {
          if (event.key === "ArrowLeft" || key === "a") delta = 80;
          else if (event.key === "ArrowRight" || key === "d") delta = -80;
          if (!delta) return;
          state.translateX += delta;
        } else {
          if (event.key === "ArrowUp" || key === "w") delta = 80;
          else if (event.key === "ArrowDown" || key === "s") delta = -80;
          if (!delta) return;
          state.translateY += delta;
        }
        event.preventDefault();
        clampTranslation();
        applyTransform();
      });

      workspace.addEventListener("pointerdown", hideImageTooltip);

      workspace.addEventListener("pointermove", (event) => {
        const immersive = Boolean(document.fullscreenElement) || state.readingMode;
        if (immersive) {
          clearTimeout(state.fullscreenCursorTimer);
          state.fullscreenCursorTimer = null;
          setCursorHidden(false);
        }
        updateImageTooltip(event);
        if (!immersive || !event.target.closest("#media-strip img")) return;
        state.fullscreenCursorTimer = setTimeout(() => {
          if (document.fullscreenElement || state.readingMode) setCursorHidden(true);
        }, 2500);
      });

      workspace.addEventListener("pointerleave", () => {
        hideInsertButton();
        hideImageTooltip();
        clearTimeout(state.fullscreenCursorTimer);
        state.fullscreenCursorTimer = null;
        setCursorHidden(false);
      });

      window.addEventListener("pointermove", (event) => {
        state.pointerY = event.clientY;
        if (document.body.classList.contains("is-ui-auto-hidden")) {
          document.body.classList.toggle(
            "is-ui-revealed",
            event.clientY <= HEADER_REVEAL_ZONE || event.clientY >= window.innerHeight - NAVIGATOR_REVEAL_ZONE,
          );
        }
      });

      document.addEventListener(
        "pointerdown",
        (event) => {
          if (event.target.closest(".app-header, #navigator")) scheduleMobileUiHide();
        },
        true,
      );

      window.addEventListener(
        "pointerdown",
        (event) => {
          if (event.pointerType !== "touch") return;
          state.mobileUiGesture = {
            pointerId: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            triggered: false,
          };
        },
        true,
      );

      window.addEventListener(
        "pointermove",
        (event) => {
          const gesture = state.mobileUiGesture;
          if (
            !gesture ||
            gesture.pointerId !== event.pointerId ||
            gesture.triggered ||
            !document.body.classList.contains("is-mobile-ui-auto-hidden")
          ) {
            return;
          }
          const deltaX = event.clientX - gesture.x;
          const deltaY = event.clientY - gesture.y;
          if (Math.abs(deltaY) >= 48 && Math.abs(deltaY) > Math.abs(deltaX) * 1.2) {
            gesture.triggered = true;
            if (deltaY < 0) hideMobileUi();
            else scheduleMobileUiHide();
          }
        },
        true,
      );

      const endMobileUiGesture = (event) => {
        const gesture = state.mobileUiGesture;
        if (!gesture || gesture.pointerId !== event.pointerId) return;
        state.mobileUiGesture = null;
        if (
          event.type === "pointerup" &&
          state.readingMode &&
          !event.target.closest(".app-header, #navigator") &&
          Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) < 6
        ) {
          if (document.body.classList.contains("is-mobile-ui-revealed")) hideMobileUi();
          else scheduleMobileUiHide();
        }
      };
      window.addEventListener("pointerup", endMobileUiGesture, true);
      window.addEventListener("pointercancel", endMobileUiGesture, true);

      navigator.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        stopPanMomentum();
        navigator.focus({ preventScroll: true });
        state.navigatorPointerId = event.pointerId;
        navigator.setPointerCapture(event.pointerId);
        setNavigatorFromClientX(event.clientX);
        scheduleMobileUiHide();
      });

      navigator.addEventListener("pointermove", (event) => {
        if (state.navigatorPointerId !== event.pointerId) return;
        setNavigatorFromClientX(event.clientX);
        scheduleMobileUiHide();
      });

      const endNavigatorDrag = (event) => {
        if (state.navigatorPointerId !== event.pointerId) return;
        state.navigatorPointerId = null;
        if (navigator.hasPointerCapture(event.pointerId)) navigator.releasePointerCapture(event.pointerId);
      };
      navigator.addEventListener("pointerup", endNavigatorDrag);
      navigator.addEventListener("pointercancel", endNavigatorDrag);

      navigator.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const data = getNavigatorData();
        if (!data) return;
        let progress = data.progress;
        if (event.key === "Home") progress = 0;
        else if (event.key === "End") progress = 1;
        else {
          const step = state.readingMode ? 1 / data.maximum : 0.05;
          progress += event.key === "ArrowLeft" ? -step : step;
        }
        const travel = getNavigatorTravelBounds();
        setNavigatorFromClientX(travel.left + Math.max(0, Math.min(1, progress)) * travel.width);
        scheduleMobileUiHide();
      });

      window.addEventListener("resize", () => {
        if (!state.layout) {
          updateAddControls();
          return;
        }
        if (state.readingMode) {
          const wasFitted = state.fitted;
          const minimumZoom = getReadingFitZoom();
          state.zoom = wasFitted ? minimumZoom : Math.max(state.zoom, minimumZoom);
          state.fitted = isZoomClose(state.zoom, minimumZoom);
          centerContent({ fullViewport: true });
          applyTransform();
          updateControls();
        } else if (document.fullscreenElement && state.fullscreenAutoFit) fitFullscreenCrossAxis();
        else if (state.fitted) {
          state.fitted = false;
          fitToScreen();
        } else if (state.defaultZoom) {
          resetToDefaultView();
        } else {
          centerContent();
          applyTransform();
        }
      });

      window.addEventListener("beforeunload", () => {
        for (const image of state.images) URL.revokeObjectURL(image.url);
      });

      updateControls();
    </script>
  </body>
</html>
