    <style>
      :root {
        --color-add-icon: #666;
        --size-drop: 500px;
        --size-add-icon: 2rem;
        --size-insert-control: 3rem;
        --size-reorder-indicator: 4px;
        --length-reorder-indicator: 90%;
        --shadow-header: 0 0 0.7rem rgba(0, 0, 0, 0.85);
        --shadow-indicator: 0 0 0.5rem var(--color-shadow-solid);
        --color-control-background: color-mix(in srgb, var(--color-white) 10%, var(--color-black) 90%);
        --size-touch-target: 2.75rem;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-drag: none;
      }

      [hidden] {
        display: none !important;
      }

      *:focus-visible {
        outline: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-black);
        color: var(--color-white);
        font-family: var(--font-mono);
      }

      button {
        color: inherit;
        font: inherit;
      }

      button:focus-visible {
        outline: 1px solid var(--color-white);
        outline-offset: 3px;
      }

      .app-header {
        position: fixed;
        top: var(--space-5xl);
        right: var(--space-5xl);
        left: var(--space-5xl);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-xl);
        pointer-events: none;
        transition:
          opacity var(--duration-fast),
          visibility 0s linear 0s;
      }

      body.is-ui-auto-hidden :is(.app-header, #navigator) {
        visibility: hidden;
        opacity: 0;
        transition:
          opacity var(--duration-fast),
          visibility 0s linear var(--duration-fast);
      }

      body.is-ui-auto-hidden.is-ui-revealed :is(.app-header, #navigator),
      body.is-ui-auto-hidden:has(.app-header :focus-visible) :is(.app-header, #navigator),
      body.is-ui-auto-hidden:has(.order-menu-control.is-open) :is(.app-header, #navigator),
      body.is-ui-auto-hidden:has(#navigator:hover) :is(.app-header, #navigator),
      body.is-ui-auto-hidden:has(#navigator:focus-visible) :is(.app-header, #navigator) {
        visibility: visible;
        opacity: 1;
        transition-delay: 0s;
      }

      .app-header > * {
        filter: drop-shadow(var(--shadow-header));
      }

      .page-title-group {
        pointer-events: auto;
      }

      #merge-icon {
        width: auto;
        height: var(--size-icon-md);
        overflow: visible;
      }

      #tools {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        height: var(--size-control-height);
        pointer-events: auto;
      }

      #reading-tools {
        position: absolute;
        left: 50%;
        display: none;
        align-items: center;
        pointer-events: auto;
        transform: translateX(-50%);
      }

      body.is-reading #reading-tools {
        display: flex;
      }

      .control-group {
        height: var(--size-control-height);
        overflow: hidden;
        border-radius: var(--radius-sm);
        background: var(--color-control-background);
      }

      .icon-group {
        display: flex;
      }

      .order-menu-control {
        position: relative;
      }

      .order-menu-control.is-open .order-menu {
        display: block;
      }

      .order-menu-option {
        height: var(--size-control-height);
        font-size: var(--text-sm);
        white-space: nowrap;
      }

      .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--size-control-height);
        height: 100%;
        border: 0;
        background: transparent;
        cursor: pointer;
        transition: var(--transition-background);
      }

      .icon-btn:hover {
        background: var(--color-white-15);
      }

      .icon-btn:focus-visible {
        outline: 0;
      }

      .icon-btn.is-active {
        background: var(--color-white-25);
      }

      #zoom-btn {
        width: var(--size-control-height);
        overflow: hidden;
        cursor: ew-resize;
        font-variant-numeric: tabular-nums;
        text-align: center;
        touch-action: none;
        user-select: none;
        font-size: var(--text-xs);
      }

      body.is-adjusting-zoom,
      body.is-adjusting-zoom * {
        cursor: ew-resize !important;
      }

      .icon-btn:disabled {
        cursor: default;
        opacity: 0.35;

      .icon-btn svg {
        width: var(--size-icon-sm);
        height: var(--size-icon-sm);
      }

      #fit-btn .icon-minimize,
      #orientation-btn .icon-horizontal,
      #reading-page-mode-btn .icon-spread {
        display: none;
      }

      #fit-btn[data-fitted="true"] .icon-maximize,
      #orientation-btn[data-orientation="vertical"] .icon-vertical {
        display: none;
      }

      #fit-btn[data-fitted="true"] .icon-minimize,
      #orientation-btn[data-orientation="vertical"] .icon-horizontal,
      #reading-page-mode-btn[data-spread="false"] .icon-spread {
        display: block;
      }

      #reading-page-mode-btn[data-spread="false"] .icon-single {
        display: none;
      }

      .action-btn {
        position: relative;
        height: var(--size-control-height);
        padding: 0 var(--space-lg);
        overflow: hidden;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: var(--text-sm);
        text-align: left;

      #download-btn,

        border: 0;
        background: var(--color-white);
        color: var(--color-black);
        transition: var(--transition-background), var(--transition-box-shadow);

      #download-btn:hover,
      #mobile-download-btn:hover {

        box-shadow: 0 0 var(--space-5xl) var(--color-download-glow);

      #mobile-download-btn {

      #download-btn::before {

        display: none;
        width: var(--size-shine-width);
        height: var(--size-full);
        background: var(--color-white-50);
        pointer-events: none;
        transform: skewX(-30deg);

      #download-btn:hover::before {
        display: block;
        animation: shine var(--duration-shine) var(--ease-shine) infinite;
      }

      #download-btn:disabled,
      #mobile-download-btn:disabled {
        cursor: wait;

      #workspace.is-panning {

        background: transparent;
        color: var(--color-white);
        cursor: pointer;
        transform: translate(-50%, -50%);

        transform: translate(-50%, -50%);
      }

      #media-strip {
        position: absolute;
        top: 0;
        left: 0;
        display: none;
        transform-origin: 0 0;
        outline: none;
      }

      #media-strip.is-visible {
        display: flex;
      }

      #media-strip[data-orientation="vertical"] {
        flex-direction: column;
      }

      #media-strip img {
        display: block;
        flex: none;
        max-width: none;
        user-select: none;
        pointer-events: auto;
        cursor: pointer;
        transition: var(--transition-opacity);
      }

      #media-strip img.is-placeholder {
        opacity: 0;
      }

      #media-strip img.no-page-transition {
        transition: none;
      }

      #media-strip[data-reorderable="true"] img {
        touch-action: none;
      }

      #media-strip.is-reordering img {
        cursor: grabbing;
      }

      #media-strip.is-reordering img.is-drag-source {
        opacity: var(--drag-opacity, 0.55);
      }

      #reorder-indicator {
        position: absolute;
        z-index: 6;
        pointer-events: none;
      }

      #reorder-indicator::before {
        position: absolute;
        top: 50%;

        background: var(--color-white);

      #reorder-indicator[data-orientation="horizontal"]::before {

        height: var(--length-reorder-indicator);
      }

      #reorder-indicator[data-orientation="vertical"]::before {
        width: var(--length-reorder-indicator);
        height: var(--size-reorder-indicator);
      }

      #delete-indicator {
        position: absolute;
        z-index: 7;
        pointer-events: none;
      }

      #image-tooltip {
        position: fixed;
        z-index: 9;
        max-width: min(24rem, calc(100vw - var(--space-5xl)));
        padding: var(--space-2xs) var(--space-sm);
        overflow: hidden;
        border: var(--border-panel);

        background: var(--color-panel);
        box-shadow: var(--shadow-menu);
        color: var(--color-text-option);
        font-size: var(--text-xs);

        pointer-events: none;
        text-overflow: ellipsis;
        white-space: nowrap;

      #image-tooltip.is-visible {
        visibility: visible;
        opacity: 1;
      }

      body:is(.is-fullscreen, .is-reading) #media-strip img {
        cursor: grab;
      }

      body:is(.is-fullscreen, .is-reading) #workspace.is-panning #media-strip img {
        cursor: grabbing;
      }

      body:is(.is-fullscreen, .is-reading).is-cursor-hidden #media-strip img {
        cursor: none;
      }

      .add-btn {
        position: absolute;
        z-index: 4;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .add-icon {
        position: absolute;
        top: var(--add-top, 50%);
        left: var(--add-left, 50%);
        width: var(--size-add-icon);
        height: var(--size-add-icon);
        fill: none;
        color: var(--color-add-icon);
        stroke: currentColor;
        stroke-width: 1;
        transform: translate(-50%, -50%);
        transition: var(--transition-color);
      }

      .add-btn:hover .add-icon,
      .add-btn:focus-visible .add-icon {
        color: var(--color-white);
      }

      #workspace:has(#initial-drop:not([hidden])):has(.add-btn[data-axis="horizontal"]:is(:hover, :focus-visible))
        .add-btn[data-axis="horizontal"]
        .add-icon,
      #workspace:has(#initial-drop:not([hidden])):has(.add-btn[data-axis="vertical"]:is(:hover, :focus-visible))
        .add-btn[data-axis="vertical"]
        .add-icon {
        color: var(--color-white);
      }

      .add-btn:focus-visible {
        outline: 0;
      }

      #insert-btn,
      .touch-insert-btn {
        position: absolute;
        z-index: 8;
        width: var(--size-insert-control);
        height: var(--size-insert-control);
        border: 0;
        border-radius: var(--radius-full);
        background: var(--color-black-75);
        cursor: pointer;
        transform: translate(-50%, -50%);
      }

      #insert-btn {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity var(--duration-fast),
          visibility 0s linear var(--duration-fast);
      }

      #insert-btn.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition-delay: 0s;
      }

      #touch-insert-controls {
        display: none;
      }

      .touch-insert-btn {
        filter: drop-shadow(var(--shadow-indicator));
        transition:
          opacity var(--duration-fast),
          visibility 0s linear 0s;
      }

      .touch-insert-btn .add-icon,
      #insert-btn .add-icon {
        top: 50%;
        left: 50%;
      }

      #insert-btn:hover .add-icon,
      #insert-btn:focus-visible .add-icon {
        color: var(--color-white);
      }

      #drop-indicator {
        position: absolute;
        z-index: 5;
        border: 0;
        outline: var(--border-crop-hover);
        outline-offset: -1px;
        background: var(--color-white-10);
        color: var(--color-text-muted);
        font-size: var(--text-sm);
        text-align: center;
        pointer-events: none;
      }

      #drop-indicator .add-icon {
        color: var(--color-white);
        opacity: 1;
      }

      #workspace[data-drag-direction="left"] .add-btn[data-direction="left"] .add-icon,
      #workspace[data-drag-direction="right"] .add-btn[data-direction="right"] .add-icon,
      #workspace[data-drag-direction="top"] .add-btn[data-direction="top"] .add-icon,
      #workspace[data-drag-direction="bottom"] .add-btn[data-direction="bottom"] .add-icon {
        opacity: 0;
      }

      #navigator {
        --navigator-expanded-height: var(--size-control-height);

        left: 50%;

        gap: 6px;
        width: var(--navigator-width, 8rem);
        max-width: calc(100vw - var(--space-5xl) * 2);
        height: calc(var(--navigator-expanded-height) - var(--radius-sm) * 2);

        filter: drop-shadow(var(--shadow-header));

          opacity var(--duration-fast),
          visibility 0s linear 0s;
      }

      #navigator:hover,
      #navigator:focus-visible {
        height: var(--navigator-expanded-height);
      }

      .navigator-range {
        display: flex;
        align-items: center;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-white-50);
        transition:
          background-color var(--duration-fast) ease,
          color var(--duration-fast) ease;
      }

      body.is-reading .navigator-range {
        transition:
          flex-grow var(--duration-fast) ease,
          background-color var(--duration-fast) ease,
          color var(--duration-fast) ease;
      }

      #navigator-before {
        justify-content: flex-start;
        flex: var(--navigator-before-grow, 0) 1 0;
      }

      #navigator-after {
        justify-content: flex-end;
        flex: var(--navigator-after-grow, 1) 1 0;
      }

      .navigator-value {
        padding: 0 var(--space-xs);
        font-size: var(--text-sm);
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--duration-fast) ease;
      }

      #navigator-thumb {
        flex: none;
        width: 2px;
        height: max(calc(100% - var(--radius-sm)), calc(var(--navigator-expanded-height) / 2 - var(--radius-sm)));

        background: var(--color-white);
        box-shadow: 0 0 0.5rem black;
      }

      #navigator:hover .navigator-range,
      #navigator:focus-visible .navigator-range {
        background: var(--color-white-15);
        color: var(--color-white-75);
      }

      #navigator:hover .navigator-value,
      #navigator:focus-visible .navigator-value {
        opacity: 1;
      }

      body.is-ui-auto-hidden #navigator {
        transition:
          height var(--duration-fast) ease,
          opacity var(--duration-fast),
          visibility 0s linear var(--duration-fast);
      }

      #file-input {
        display: none;
      }

      #status {

        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);

      body.is-fullscreen .add-btn,
      body.is-fullscreen #insert-btn,

      }

      body.is-reading .add-btn,
      body.is-reading #insert-btn,
      body.is-reading #touch-insert-controls,
      body.is-reading #drop-indicator,
      body.is-reading #reorder-indicator,
      body.is-reading #delete-indicator {
        display: none;
      }

        }

        .page-title-group {

      const ADD_CONTROL_OFFSET = 32;

      const INSERT_HOVER_DISTANCE = 32;

      const fileNameCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
      const ORDER_ACTIONS = Object.freeze({
        name: sortImagesByName,
        modified: sortImagesByLastModified,
        reverse: reverseImageOrder,
      });
      const imageElements = new WeakMap();

      const state = {
        images: [],
        referenceImage: null,
        orientation: "horizontal",
        zoom: 1,
        defaultZoom: true,
        translateX: 0,
        translateY: 0,
        fitted: false,
        dragDirection: null,
        layout: null,
        statusTimer: null,
        pan: null,
        beforeFullscreen: null,
        fullscreenAutoFit: false,
        pendingDirection: "initial",
        pendingInsertIndex: null,
        replaceIndex: null,
        reorder: null,
        autoScroll: null,
        insertHover: null,
        suppressImageClick: false,
        fullscreenCursorTimer: null,
        readingMode: false,

        pointerY: null,

        mobileUiGesture: null,

        tooltipTimer: null,
        zoomControl: null,

        pinch: null,
        panMomentum: null,

      function isZoomClose(left, right) {
        return Math.abs(left - right) <= Math.max(1, left, right) * ZOOM_EPSILON;
      }

      function getDirectionAxis(direction) {
        return DIRECTION_AXIS[direction] || null;
      }

      function updatePreservedZoomModes(wasFitted, wasDefaultZoom) {
        state.fitted = wasFitted && isZoomClose(state.zoom, getFitZoom());
        state.defaultZoom = wasDefaultZoom && isZoomClose(state.zoom, getDefaultZoom());
      }

      function loadImageElement(image) {
        return new Promise((resolve, reject) => {
          const element = new Image();
          element.decoding = "async";
          element.addEventListener("load", () => resolve(element), { once: true });
          element.addEventListener("error", () => reject(new Error("Image could not be decoded")), { once: true });
          element.src = image.url;
        });
      }

      function loadDisplayImage(element) {
        const image = imageElements.get(element);
        if (!image || element.getAttribute("src") === image.url) return;
        element.classList.add("is-placeholder");
        element.addEventListener("load", () => element.classList.remove("is-placeholder"), { once: true });
        element.src = image.url;
      }

      function unloadDisplayImage(element) {
        if (!element.hasAttribute("src")) return;
        element.classList.add("is-placeholder");
        element.removeAttribute("src");
      }

      const imageObserver =
        "IntersectionObserver" in window
          ? new IntersectionObserver(
              (entries) => {
                for (const entry of entries) {
                  if (entry.isIntersecting) loadDisplayImage(entry.target);
                  else unloadDisplayImage(entry.target);
                }
              },
              { root: workspace, rootMargin: "50%" },
            )
          : null;

        clearTimeout(state.statusTimer);
        status.textContent = message;
        status.classList.add("is-visible");
        state.statusTimer = setTimeout(() => status.classList.remove("is-visible"), 2600);
      }

      function getViewportBounds() {
        const fullscreen = Boolean(document.fullscreenElement);
        const headerBottom = fullscreen ? 0 : appHeader.getBoundingClientRect().bottom;
        const gutter = fullscreen ? 0 : 32;
        return {
          left: gutter,
          top: fullscreen ? 0 : Math.min(window.innerHeight, headerBottom + 16),
          right: window.innerWidth - gutter,
          bottom: window.innerHeight - gutter,
        };
      }

      function getDefaultDisplaySize() {
        const compact = compactViewportQuery.matches;
        const widthGutter = compact ? 40 : 64;
        const heightGutter = compact ? 160 : 128;
        return Math.max(
          1,
          Math.min(DROP_REFERENCE_SIZE, window.innerWidth - widthGutter, window.innerHeight - heightGutter),
        );
      }

      function getLayoutOrientation() {
        return state.readingMode && state.readingSpread ? "horizontal" : state.orientation;
      }

      function getReadingPageStarts() {
        if (!state.images.length) return [];
        if (!state.readingSpread) return state.images.map((_, index) => index);
        const starts = [0];
        for (let index = state.readingOffset ? 1 : 2; index < state.images.length; index += 2) starts.push(index);
        return starts;
      }

      function normalizeReadingPage() {
        const starts = getReadingPageStarts();
        if (!starts.length) {
          state.readingPage = 0;
          return;
        }
        state.readingPage = starts.reduce((nearest, start) =>
          Math.abs(start - state.readingPage) < Math.abs(nearest - state.readingPage) ? start : nearest,
        );
      }

      function getReadingPageIndices() {
        normalizeReadingPage();
        if (!state.readingSpread || (state.readingOffset && state.readingPage === 0)) return [state.readingPage];
        return [state.readingPage, state.readingPage + 1].filter((index) => index < state.images.length);
      }

      function getLayoutEntries({ allImages = false } = {}) {
        if (!state.readingMode || allImages) {
          return state.images.map((image, sourceIndex) => ({ image, sourceIndex }));
        }
        const entries = getReadingPageIndices().map((sourceIndex) => ({
          image: state.images[sourceIndex],
          sourceIndex,
        }));
        return state.readingSpread ? entries.reverse() : entries;
      }

      function getReadingFitZoom() {
        if (!state.layout) return 1;
        return Math.max(
          Number.EPSILON,
          Math.min(window.innerWidth / state.layout.width, window.innerHeight / state.layout.height),
        );
      }

      function getSingleImageMarginZoom() {
        if (!state.layout || state.images.length !== 1) return Infinity;
        const bounds = getActiveBounds();
        const horizontal = getLayoutOrientation() === "horizontal";
        const mainAxisSize = horizontal ? state.layout.width : state.layout.height;
        const availableMainAxis = horizontal
          ? bounds.right - bounds.left - MIN_END_MARGIN * 2
          : bounds.bottom - bounds.top - MIN_END_MARGIN * 2;
        return Math.max(Number.EPSILON, availableMainAxis / mainAxisSize);
      }

      function getMinimumZoom() {
        if (state.readingMode) return getReadingFitZoom();
        return Math.min(MIN_ZOOM, getSingleImageMarginZoom());
      }

      function getDefaultZoom() {
        if (!state.layout) return 1;
        if (state.readingMode) return getReadingFitZoom();
        const crossSize = getLayoutOrientation() === "horizontal" ? state.layout.height : state.layout.width;
        const crossAxisZoom = getDefaultDisplaySize() / crossSize;
        const marginZoom = getSingleImageMarginZoom();
        return Math.max(getMinimumZoom(), Math.min(crossAxisZoom, marginZoom));
      }

      function getZoomPercentage() {
        if (!state.layout) return 100;
        return Math.max(1, Math.min(MAX_ZOOM * 100, Math.round((state.zoom / getDefaultZoom()) * 100)));
      }

      function resetToDefaultView() {
        if (!state.layout) return;
        stopPanMomentum();
        state.zoom = getDefaultZoom();
        state.fitted = false;
        state.defaultZoom = true;
        centerContent();
        applyTransform();
        updateControls();
      }

      function buildLayout(options = {}) {
        if (!state.images.length) return null;
        const entries = getLayoutEntries(options);
        const horizontal = (options.allImages ? state.orientation : getLayoutOrientation()) === "horizontal";
        const useStableReference = options.allImages || !state.readingMode;
        const referenceImage = useStableReference ? state.referenceImage || entries[0].image : entries[0].image;
        const crossSize = horizontal ? referenceImage.height : referenceImage.width;
        let cursor = 0;
        const items = entries.map(({ image, sourceIndex }) => {
          const width = horizontal ? (image.width * crossSize) / image.height : crossSize;
          const height = horizontal ? crossSize : (image.height * crossSize) / image.width;
          const item = { image, sourceIndex, x: horizontal ? cursor : 0, y: horizontal ? 0 : cursor, width, height };
          cursor += horizontal ? width : height;
          return item;
        });
        return {
          items,
          width: horizontal ? cursor : crossSize,
          height: horizontal ? crossSize : cursor,
        };
      }

      function getActiveBounds() {
        return { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };
      }

      function getScrollMetrics(zoom = state.zoom) {
        if (!state.layout || state.images.length < 2) return null;
        const bounds = getActiveBounds();
        const horizontal = getLayoutOrientation() === "horizontal";
        const viewportStart = horizontal ? bounds.left : bounds.top;
        const viewportEnd = horizontal ? bounds.right : bounds.bottom;
        const contentSize = (horizontal ? state.layout.width : state.layout.height) * zoom;
        const availableSize = viewportEnd - viewportStart - MIN_END_MARGIN * 2;
        if (contentSize <= availableSize) {
          const centered = (viewportStart + viewportEnd - contentSize) / 2;
          return { axis: horizontal ? "x" : "y", start: centered, end: centered, distance: 0 };
        }
        const start = viewportStart + MIN_END_MARGIN;
        const end = viewportEnd - MIN_END_MARGIN - contentSize;
        return { axis: horizontal ? "x" : "y", start, end, distance: start - end };
      }

      function getScrollProgress() {
        const metrics = getScrollMetrics();
        if (!metrics || metrics.distance === 0) return 0.5;
        const current = metrics.axis === "x" ? state.translateX : state.translateY;
        return Math.max(0, Math.min(1, (metrics.start - current) / metrics.distance));
      }

      function setScrollProgress(progress, { centerCrossAxis = true } = {}) {
        if (!state.layout) return;
        const metrics = getScrollMetrics();
        const safeProgress = Math.max(0, Math.min(1, progress));
        const bounds = getActiveBounds();
        const centerX = (bounds.left + bounds.right) / 2;
        const centerY = (bounds.top + bounds.bottom) / 2;

        if (!metrics) {
          if (centerCrossAxis) {
            state.translateX = centerX - (state.layout.width * state.zoom) / 2;
            state.translateY = centerY - (state.layout.height * state.zoom) / 2;
          }
          return;
        }

        const translation = metrics.start - safeProgress * metrics.distance;
        if (metrics.axis === "x") {
          state.translateX = translation;
          if (centerCrossAxis) state.translateY = centerY - (state.layout.height * state.zoom) / 2;
        } else {
          state.translateY = translation;
          if (centerCrossAxis) state.translateX = centerX - (state.layout.width * state.zoom) / 2;
        }
      }

      function getNavigatorData() {
        if (!state.layout || document.fullscreenElement) return null;
        if (state.readingMode) {
          const starts = getReadingPageStarts();
          if (starts.length < 2) return null;
          const position = starts.indexOf(state.readingPage);
          const maximum = starts.length - 1;
          return {
            maximum,
            position,
            progress: 1 - position / maximum,
            widthBasis: 32 + (starts.length - 1) * NAVIGATOR_MAX_STEP_WIDTH,
            valueText: `Page ${position + 1} of ${starts.length}`,
          };
        }
        const metrics = getScrollMetrics();
        if (!metrics || metrics.distance <= 0) return null;
        const progress = getScrollProgress();
        return {
          maximum: 100,
          position: Math.round(progress * 100),
          progress,
          widthBasis: 48 + Math.sqrt(metrics.distance) * 10,
          valueText: `${Math.round(progress * 100)}%`,
        };
      }

      function scheduleMobileUiHide() {
        clearTimeout(state.mobileUiTimer);
        document.body.classList.add("is-mobile-ui-revealed");
        state.mobileUiTimer = setTimeout(() => {
          state.mobileUiTimer = null;
          document.body.classList.remove("is-mobile-ui-revealed");
        }, MOBILE_UI_TIMEOUT);
      }

      function hideMobileUi() {
        clearTimeout(state.mobileUiTimer);
        state.mobileUiTimer = null;
        document.body.classList.remove("is-mobile-ui-revealed");
      }

      function updateUiVisibility() {
        const fitZoom = state.layout ? getFitZoom() : 1;
        const desktopAutoHide =
          Boolean(state.layout) &&
          !document.fullscreenElement &&
          finePointerQuery.matches &&
          (state.zoom >= fitZoom || isZoomClose(state.zoom, fitZoom));
        const pointerInRevealZone =
          state.pointerY !== null &&
          (state.pointerY <= HEADER_REVEAL_ZONE || state.pointerY >= window.innerHeight - NAVIGATOR_REVEAL_ZONE);
        document.body.classList.toggle("is-ui-auto-hidden", desktopAutoHide);
        document.body.classList.toggle("is-ui-revealed", desktopAutoHide && pointerInRevealZone);

        const mobileAutoHide =
          usesTouchInsertion() &&
          Boolean(state.layout) &&
          !document.fullscreenElement &&
          (state.readingMode || state.fitted);
        const wasMobileAutoHidden = document.body.classList.contains("is-mobile-ui-auto-hidden");
        document.body.classList.toggle("is-mobile-ui-auto-hidden", mobileAutoHide);
        if (mobileAutoHide && !wasMobileAutoHidden) scheduleMobileUiHide();
        if (!mobileAutoHide) {
          clearTimeout(state.mobileUiTimer);
          state.mobileUiTimer = null;
          document.body.classList.remove("is-mobile-ui-revealed");
        }
      }

      function updateNavigator() {
        const data = getNavigatorData();
        navigator.hidden = !data;
        if (!data) {
          updateUiVisibility();
          return;
        }

        const sideMargin = usesTouchInsertion() ? 40 : 64;
        const availableWidth = Math.max(1, Math.min(NAVIGATOR_MAX_WIDTH, window.innerWidth - sideMargin));
        const width = Math.min(availableWidth, Math.max(72, data.widthBasis));
        navigator.style.setProperty("--navigator-width", `${width}px`);
        navigator.style.setProperty("--navigator-before-grow", String(data.progress));
        navigator.style.setProperty("--navigator-after-grow", String(1 - data.progress));
        navigatorBeforeValue.textContent = String(state.readingMode ? data.maximum - data.position : data.position);
        navigatorAfterValue.textContent = String(state.readingMode ? data.position : data.maximum - data.position);
        navigator.setAttribute("aria-valuemax", String(data.maximum));
        navigator.setAttribute("aria-valuenow", String(data.position));
        navigator.setAttribute("aria-valuetext", data.valueText);
        navigator.setAttribute("aria-label", state.readingMode ? "Reading page" : "Scroll position");

        updateUiVisibility();
      }

      function getNavigatorTravelBounds() {
        const rect = navigator.getBoundingClientRect();
        const gap = Number.parseFloat(getComputedStyle(navigator).columnGap) || 0;
        const thumbWidth = navigatorThumb.getBoundingClientRect().width;
        const inset = gap + thumbWidth / 2;
        return { left: rect.left + inset, width: Math.max(1, rect.width - inset * 2) };
      }

      function setNavigatorFromClientX(clientX) {
        const data = getNavigatorData();
        if (!data) return;
        const travel = getNavigatorTravelBounds();
        const progress = Math.max(0, Math.min(1, (clientX - travel.left) / travel.width));
        if (state.readingMode) {
          const starts = getReadingPageStarts();
          const position = Math.round((1 - progress) * (starts.length - 1));
          if (starts[position] === state.readingPage) return;
          state.readingPage = starts[position];
          if (state.readingOffset) state.readingOffsetOriginPage = null;
          renderLayout({ recenter: false, animateImages: false });
          resetReadingView();
          return;
        }
        setScrollProgress(progress);
        applyTransform();
      }

      function clampTranslation({ centerCrossAxis = true } = {}) {
        if (!state.layout) return;
        const bounds = getActiveBounds();
        const centerX = (bounds.left + bounds.right) / 2;
        const centerY = (bounds.top + bounds.bottom) / 2;
        if (state.readingMode) {
          const width = state.layout.width * state.zoom;
          const height = state.layout.height * state.zoom;
          state.translateX =
            width <= bounds.right - bounds.left
              ? centerX - width / 2
              : Math.max(bounds.right - width, Math.min(bounds.left, state.translateX));
          state.translateY =
            height <= bounds.bottom - bounds.top
              ? centerY - height / 2
              : Math.max(bounds.bottom - height, Math.min(bounds.top, state.translateY));
          return;
        }
        const metrics = getScrollMetrics();

        if (metrics?.axis === "x") {
          state.translateX = Math.max(metrics.end, Math.min(metrics.start, state.translateX));
          if (centerCrossAxis) state.translateY = centerY - (state.layout.height * state.zoom) / 2;
        } else if (metrics?.axis === "y") {
          state.translateY = Math.max(metrics.end, Math.min(metrics.start, state.translateY));
          if (centerCrossAxis) state.translateX = centerX - (state.layout.width * state.zoom) / 2;
        } else if (centerCrossAxis) {
          state.translateX = centerX - (state.layout.width * state.zoom) / 2;
          state.translateY = centerY - (state.layout.height * state.zoom) / 2;
        }
      }

      function centerContent({ fullViewport = false } = {}) {
        if (!state.layout) return;
        const bounds =
          fullViewport || state.images.length === 1 || state.readingMode
            ? { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight }
            : getViewportBounds();
        state.translateX = (bounds.left + bounds.right - state.layout.width * state.zoom) / 2;
        state.translateY = (bounds.top + bounds.bottom - state.layout.height * state.zoom) / 2;
        if (!fullViewport) clampTranslation();
      }

      function applyTransform() {
        if (!state.layout) return;
        mediaStrip.style.width = `${state.layout.width}px`;
        mediaStrip.style.height = `${state.layout.height}px`;
        mediaStrip.style.transform = `translate3d(${state.translateX}px, ${state.translateY}px, 0) scale(${state.zoom})`;
        workspace.dataset.orientation = getLayoutOrientation();
        workspace.dataset.zoom = state.zoom.toFixed(4);
        workspace.dataset.translateX = state.translateX.toFixed(2);
        workspace.dataset.translateY = state.translateY.toFixed(2);
        updateAddControls();
        if (usesTouchInsertion()) updateTouchInsertButtons();
        else if (state.insertHover) updateInsertButton(state.insertHover.clientX, state.insertHover.clientY);
        if (state.autoScroll?.mode === "external") {
          const direction = getDropDirection(state.autoScroll.clientX, state.autoScroll.clientY);
          if (direction !== state.dragDirection) showDropIndicator(direction);
          else if (direction && state.images.length) positionDropIndicator(direction);
        } else if (state.dragDirection && state.images.length) {
          positionDropIndicator(state.dragDirection);
        }
        if (state.reorder?.active) {
          if (state.reorder.deleteReady) {
            reorderIndicator.hidden = true;
            positionDeleteIndicator();
          } else {
            updateReorderTarget(state.reorder.clientX, state.reorder.clientY);
          }
        }
        updateNavigator();
      }

      function getEdgeScrollDelta(clientX, clientY) {
        const metrics = getScrollMetrics();
        if (!metrics || metrics.distance === 0) return 0;
        const coordinate = metrics.axis === "x" ? clientX : clientY;
        const viewportSize = metrics.axis === "x" ? window.innerWidth : window.innerHeight;
        let delta = 0;
        if (coordinate < EDGE_SCROLL_ZONE) {
          delta = EDGE_SCROLL_MAX_SPEED * (1 - Math.max(0, coordinate) / EDGE_SCROLL_ZONE);
        } else if (coordinate > viewportSize - EDGE_SCROLL_ZONE) {
          delta = -EDGE_SCROLL_MAX_SPEED * (1 - Math.max(0, viewportSize - coordinate) / EDGE_SCROLL_ZONE);
        }
        const current = metrics.axis === "x" ? state.translateX : state.translateY;
        if ((delta > 0 && current >= metrics.start) || (delta < 0 && current <= metrics.end)) return 0;
        return delta;
      }

      function stopAutoScroll(mode) {
        if (!state.autoScroll || (mode && state.autoScroll.mode !== mode)) return;
        if (state.autoScroll.frame) cancelAnimationFrame(state.autoScroll.frame);
        state.autoScroll = null;
      }

      function runAutoScroll() {
        const autoScroll = state.autoScroll;
        if (!autoScroll) return;
        autoScroll.frame = null;
        const delta = getEdgeScrollDelta(autoScroll.clientX, autoScroll.clientY);
        if (!delta) return;
        const metrics = getScrollMetrics();
        if (metrics.axis === "x") state.translateX += delta;
        else state.translateY += delta;
        clampTranslation();
        applyTransform();
        if (state.autoScroll === autoScroll) autoScroll.frame = requestAnimationFrame(runAutoScroll);
      }

      function updateAutoScroll(mode, clientX, clientY) {
        if (state.autoScroll?.mode !== mode) stopAutoScroll();
        if (!state.autoScroll) state.autoScroll = { mode, clientX, clientY, frame: null };
        state.autoScroll.clientX = clientX;
        state.autoScroll.clientY = clientY;
        if (!state.autoScroll.frame && getEdgeScrollDelta(clientX, clientY)) {
          state.autoScroll.frame = requestAnimationFrame(runAutoScroll);
        }
      }

      function updateReadingControls() {
        document.body.classList.toggle("is-reading", state.readingMode);
        readingModeBtn.classList.toggle("is-active", state.readingMode);
        readingModeBtn.setAttribute("aria-pressed", String(state.readingMode));
        readingModeBtn.setAttribute("aria-label", state.readingMode ? "Disable reading mode" : "Enable reading mode");
        readingModeBtn.title = state.readingMode ? "Exit reading mode" : "Reading mode";
        readingPageModeBtn.dataset.spread = String(state.readingSpread);
        readingPageModeBtn.setAttribute(
          "aria-label",
          state.readingSpread ? "Show a single page" : "Show a full spread",
        );
        readingPageModeBtn.title = state.readingSpread ? "Single page" : "Full spread";
        readingOffsetBtn.disabled = !state.readingSpread;
        const offsetActive = state.readingOffset && state.readingSpread;
        readingOffsetBtn.classList.toggle("is-active", offsetActive);
        readingOffsetBtn.setAttribute("aria-pressed", String(offsetActive));
        readingOffsetBtn.setAttribute(
          "aria-label",
          state.readingOffset ? "Start with a two-page first spread" : "Start with a single first page",
        );
        readingOffsetBtn.title = state.readingOffset ? "Remove spread offset" : "Offset full spread";

        const starts = getReadingPageStarts();
        const position = starts.indexOf(state.readingPage);
        readingPreviousBtn.disabled = position <= 0;
        readingNextBtn.disabled = position < 0 || position >= starts.length - 1;
        readingTools.setAttribute("aria-hidden", String(!state.readingMode));
      }

      function updateControls() {
        const hasImages = state.images.length > 0;
        tools.hidden = !hasImages;
        initialDrop.hidden = hasImages;
        workspace.classList.toggle("has-images", state.readingMode ? hasImages : state.images.length > 1);
        mediaStrip.classList.toggle("is-visible", hasImages);
        mediaStrip.dataset.orientation = getLayoutOrientation();
        const zoomPercentage = getZoomPercentage();
        zoomBtn.textContent = String(zoomPercentage);
        zoomBtn.setAttribute("aria-label", `Zoom ${zoomPercentage}%`);
        zoomBtn.title = `Zoom ${zoomPercentage}%`;
        fitBtn.dataset.fitted = String(state.fitted);
        fitBtn.setAttribute("aria-label", state.fitted ? "Reset zoom" : "Fit to screen");
        fitBtn.title = state.fitted ? "Reset zoom" : "Fit to screen";
        const readingMinimum = state.readingMode && isZoomClose(state.zoom, getReadingFitZoom());
        fitBtn.disabled = readingMinimum;
        orientationBtn.dataset.orientation = state.orientation;
        const nextDirection = state.orientation === "horizontal" ? "vertically" : "horizontally";
        orientationBtn.setAttribute("aria-label", `Arrange ${nextDirection}`);
        orientationBtn.title = `Arrange ${nextDirection}`;
        workspace.dataset.imageCount = String(state.images.length);
        fullscreenBtn.disabled = usesTouchInsertion();
        if (usesTouchInsertion()) updateTouchInsertButtons();
        else if (state.images.length < 2 || state.readingMode) hideInsertButton();
        updateReadingControls();
        updateAddControls();
        updateNavigator();
      }

      function updateImageInteractions() {
        const fullscreen = Boolean(document.fullscreenElement);
        const reorderable = state.images.length > 0 && !fullscreen && !state.readingMode;
        mediaStrip.dataset.reorderable = String(reorderable);
        for (const image of mediaStrip.children) {
          image.draggable = false;
          image.tabIndex = -1;
          image.toggleAttribute("aria-disabled", fullscreen && !state.readingMode);
        }
      }

      function hideImageTooltip() {
        clearTimeout(state.tooltipTimer);
        state.tooltipTimer = null;
        state.tooltipTarget = null;
        imageTooltip.classList.remove("is-visible");
        imageTooltip.setAttribute("aria-hidden", "true");
      }

      function positionImageTooltip(clientX, clientY) {
        imageTooltip.style.left = "0";
        imageTooltip.style.top = "0";
        const rect = imageTooltip.getBoundingClientRect();
        const left = Math.max(
          TOOLTIP_OFFSET,
          Math.min(window.innerWidth - rect.width - TOOLTIP_OFFSET, clientX + TOOLTIP_OFFSET),
        );
        const top = Math.max(
          TOOLTIP_OFFSET,
          Math.min(window.innerHeight - rect.height - TOOLTIP_OFFSET, clientY + TOOLTIP_OFFSET),
        );
        imageTooltip.style.left = `${left}px`;
        imageTooltip.style.top = `${top}px`;
      }

      function updateImageTooltip(event) {
        const image = event.target instanceof Element ? event.target.closest("#media-strip img") : null;
        hideImageTooltip();
        if (!image || document.body.classList.contains("is-cursor-hidden") || state.reorder?.active || state.pan) {
          return;
        }
        state.tooltipTarget = image;
        const clientX = event.clientX;
        const clientY = event.clientY;
        state.tooltipTimer = setTimeout(() => {
          state.tooltipTimer = null;
          if (
            state.tooltipTarget !== image ||
            !image.isConnected ||
            document.body.classList.contains("is-cursor-hidden") ||
            state.reorder?.active ||
            state.pan
          ) {
            hideImageTooltip();
            return;
          }
          imageTooltip.textContent = imageElements.get(image)?.name || "";
          imageTooltip.classList.add("is-visible");
          imageTooltip.setAttribute("aria-hidden", "false");
          positionImageTooltip(clientX, clientY);
        }, TOOLTIP_DELAY);
      }

      function setCursorHidden(hidden) {
        if (document.body.classList.contains("is-cursor-hidden") === hidden) return;
        document.body.classList.toggle("is-cursor-hidden", hidden);
        if (hidden) hideImageTooltip();
      }

      function renderLayout({ recenter = true, animateImages = true } = {}) {
        stopPanMomentum();
        state.layout = buildLayout();
        imageObserver?.disconnect();
        hideImageTooltip();
        mediaStrip.replaceChildren();
        if (!state.layout) {
          updateControls();
          return;
        }

        const fragment = document.createDocumentFragment();
        const renderedImages = [];
        for (const item of state.layout.items) {
          const image = document.createElement("img");
          image.alt = `Image ${item.sourceIndex + 1}: ${item.image.name}`;
          image.dataset.index = String(item.sourceIndex);
          image.decoding = "async";
          image.loading = "lazy";
          image.classList.add("is-placeholder");
          if (!animateImages) image.classList.add("no-page-transition");
          imageElements.set(image, item.image);
          if (state.readingMode) {
            image.setAttribute("role", "img");
          } else {
            image.setAttribute("role", "button");
            image.setAttribute("aria-label", `Replace image ${item.sourceIndex + 1}: ${item.image.name}`);
          }
          image.width = Math.max(1, Math.round(item.width));
          image.height = Math.max(1, Math.round(item.height));
          image.style.width = `${item.width}px`;
          image.style.height = `${item.height}px`;
          fragment.append(image);
          renderedImages.push(image);
        }
        mediaStrip.append(fragment);
        for (const image of renderedImages) {
          if (imageObserver) imageObserver.observe(image);
          else loadDisplayImage(image);
        }

        updateImageInteractions();

        if (recenter) centerContent();
        applyTransform();
        updateControls();
      }

      function resetReadingView() {
        if (!state.readingMode || !state.layout) return;
        state.zoom = getReadingFitZoom();
        state.fitted = true;
        state.defaultZoom = false;
        centerContent({ fullViewport: true });
        applyTransform();
        updateControls();
      }

      function setReadingMode(enabled) {
        if (enabled === state.readingMode || !state.images.length) return;
        stopAutoScroll();
        state.pan = null;
        state.reorder = null;
        clearReorderVisuals();
        hideInsertButton();
        hideDropIndicator();
        if (enabled) {
          state.beforeReading = {
            zoom: state.zoom,
            fitted: state.fitted,
            defaultZoom: state.defaultZoom,
            progress: getScrollProgress(),
          };
          state.readingMode = true;
          state.readingSpread = true;
          state.readingOffset = false;
          state.readingPage = 0;
          state.readingOffsetOriginPage = null;
          renderLayout({ recenter: false });
          resetReadingView();
          announce("Reading mode enabled. Right-bound full spread.");
          return;
        }

        const previousView = state.beforeReading;
        state.readingMode = false;
        clearTimeout(state.fullscreenCursorTimer);
        state.fullscreenCursorTimer = null;
        setCursorHidden(false);
        state.beforeReading = null;
        renderLayout({ recenter: false });
        if (previousView) {
          state.zoom = previousView.zoom;
          state.fitted = previousView.fitted;
          state.defaultZoom = previousView.defaultZoom;
          setScrollProgress(previousView.progress);
        } else {
          state.zoom = getDefaultZoom();
          state.fitted = false;
          state.defaultZoom = true;
          centerContent();
        }
        applyTransform();
        updateControls();
        announce("Reading mode disabled.");
      }

      function moveReadingPage(delta) {
        if (!state.readingMode) return;
        const starts = getReadingPageStarts();
        const position = starts.indexOf(state.readingPage);
        const nextPosition = Math.max(0, Math.min(starts.length - 1, position + delta));
        if (position < 0 || nextPosition === position) return;
        state.readingPage = starts[nextPosition];
        if (state.readingOffset) state.readingOffsetOriginPage = null;
        renderLayout({ recenter: false, animateImages: false });
        resetReadingView();
        const pages = getReadingPageIndices().map((index) => index + 1);
        announce(`Page ${pages.join("–")} of ${state.images.length}.`);
      }

      function refreshReadingLayout() {
        if (!state.readingMode) return;
        normalizeReadingPage();
        renderLayout({ recenter: false });
        resetReadingView();
      }

      function clearImages() {
        imageObserver?.disconnect();
        hideImageTooltip();
        for (const image of state.images) {
          URL.revokeObjectURL(image.url);
        }
        state.images = [];
        state.referenceImage = null;
        state.layout = null;
        state.orientation = "horizontal";
        state.zoom = 1;
        state.fitted = false;
        state.defaultZoom = true;
        state.fullscreenAutoFit = false;
        state.dragDirection = null;
        state.pendingDirection = "initial";
        state.pendingInsertIndex = null;
        state.replaceIndex = null;
        state.reorder = null;
        state.readingMode = false;
        state.readingSpread = true;
        state.readingOffset = false;
        state.readingPage = 0;
        state.readingOffsetOriginPage = null;
        state.beforeReading = null;
        clearTimeout(state.mobileUiTimer);
        state.mobileUiTimer = null;
        state.mobileUiGesture = null;
        state.touchPoints.clear();
        state.pinch = null;
        stopPanMomentum();
        stopAutoScroll();
        state.suppressImageClick = false;
        mediaStrip.classList.remove("is-reordering");
        mediaStrip.replaceChildren();
        mediaStrip.removeAttribute("style");
        document.body.classList.remove(
          "is-reading",
          "is-ui-auto-hidden",
          "is-ui-revealed",
          "is-mobile-ui-auto-hidden",
          "is-mobile-ui-revealed",
          "is-cursor-hidden",
        );
        hideInsertButton();
        hideDropIndicator();
        updateControls();
      }

      async function decodeFile(file) {
        if (!file.type.startsWith("image/")) return null;
        const url = URL.createObjectURL(file);
        try {
          const element = await loadImageElement({ url });
          if (!element.naturalWidth || !element.naturalHeight) throw new Error("Image has no dimensions");
          const image = {
            file,
            url,
            width: element.naturalWidth,
            height: element.naturalHeight,
            name: file.name,
          };
          element.removeAttribute("src");
          return image;
        } catch (error) {
          URL.revokeObjectURL(url);
          console.error(`Could not open ${file.name}`, error);
          return null;
        }
      }

      function getImageFiles(fileList) {
        return Array.from(fileList).filter((file) => file.type.startsWith("image/"));
      }

      async function decodeFiles(files) {
        const decoded = [];
        for (const file of files) {
          const image = await decodeFile(file);
          if (image) decoded.push(image);
        }
        return decoded;
      }

      async function addFiles(fileList, direction = "initial", insertIndex = null) {
        const files = getImageFiles(fileList);
        if (!files.length) {
          announce("Choose one or more image files.");
          return;
        }

        const decoded = await decodeFiles(files);
        if (!decoded.length) {
          announce("The selected images could not be opened.");
          return;
        }

        const hadImages = state.images.length > 0;
        const appendingAtEnd = !Number.isInteger(insertIndex) && (direction === "right" || direction === "bottom");
        const anchorImage = state.images[0] || null;
        const anchorItem = state.layout?.items.find((item) => item.image === anchorImage);
        const previousView = hadImages
          ? {
              zoom: state.zoom,
              fitted: state.fitted,
              defaultZoom: state.defaultZoom,
              fullscreenAutoFit: state.fullscreenAutoFit,
              progress: getScrollProgress(),
              keepEndVisible: appendingAtEnd && getScrollProgress() >= 0.999,
              anchorImage,
              anchorLeft: anchorItem ? state.translateX + anchorItem.x * state.zoom : null,
              anchorTop: anchorItem ? state.translateY + anchorItem.y * state.zoom : null,
            }
          : null;

        if (!hadImages) {
          state.images.push(...decoded);
          state.referenceImage = decoded[0];
          state.orientation = getDirectionAxis(direction) || "horizontal";
        } else {
          if (state.images.length === 1 && !Number.isInteger(insertIndex)) {
            state.orientation = getDirectionAxis(direction) || state.orientation;
          }
          if (Number.isInteger(insertIndex)) {
            const safeIndex = Math.max(1, Math.min(state.images.length - 1, insertIndex));
            state.images.splice(safeIndex, 0, ...decoded);
          } else if (direction === "left" || direction === "top") state.images.unshift(...decoded);
          else state.images.push(...decoded);
        }

        renderLayout({ recenter: false });
        if (!previousView) {
          resetToDefaultView();
        } else {
          state.zoom = previousView.zoom;
          state.fullscreenAutoFit = previousView.fullscreenAutoFit;
          const nextAnchorItem = state.layout.items.find((item) => item.image === previousView.anchorImage);
          if (previousView.keepEndVisible) {
            setScrollProgress(1);
          } else if (nextAnchorItem && previousView.anchorLeft !== null && previousView.anchorTop !== null) {
            state.translateX = previousView.anchorLeft - nextAnchorItem.x * state.zoom;
            state.translateY = previousView.anchorTop - nextAnchorItem.y * state.zoom;
          } else {
            setScrollProgress(previousView.progress);
          }
          clampTranslation({ centerCrossAxis: false });
          updatePreservedZoomModes(previousView.fitted, previousView.defaultZoom);
          applyTransform();
          updateControls();
        }
        announce(`${decoded.length} image${decoded.length === 1 ? "" : "s"} added.`);
      }

      async function replaceImages(index, fileList) {
        const files = getImageFiles(fileList);
        if (!files.length || !state.images[index]) {
          announce("Choose one or more image files.");
          return;
        }

        const replacements = await decodeFiles(files);
        if (!replacements.length) {
          announce("The selected images could not be opened.");
          return;
        }

        const oldItem = state.layout?.items[index];
        const zoom = state.zoom;
        const wasFitted = state.fitted;
        const wasDefaultZoom = state.defaultZoom;
        const oldLeft = oldItem ? state.translateX + oldItem.x * zoom : null;
        const oldTop = oldItem ? state.translateY + oldItem.y * zoom : null;
        const [removed] = state.images.splice(index, 1, ...replacements);
        if (state.referenceImage === removed) state.referenceImage = replacements[0];
        URL.revokeObjectURL(removed.url);
        renderLayout({ recenter: false });

        state.zoom = zoom;
        if (state.images.length === 1) {
          centerContent();
        } else {
          const replacementItem = state.layout.items.find((item) => item.image === replacements[0]);
          if (replacementItem && oldLeft !== null && oldTop !== null) {
            state.translateX = oldLeft - replacementItem.x * state.zoom;
            state.translateY = oldTop - replacementItem.y * state.zoom;
          }
          clampTranslation({ centerCrossAxis: false });
        }
        updatePreservedZoomModes(wasFitted, wasDefaultZoom);
        applyTransform();
        updateControls();
        announce(
          `${replacements.length} image${replacements.length === 1 ? "" : "s"} placed from position ${index + 1}.`,
        );
      }

      function removeImage(index) {
        if (document.fullscreenElement || state.readingMode || !state.images[index]) return;
        const zoom = state.zoom;
        const wasFitted = state.fitted;
        const wasDefaultZoom = state.defaultZoom;
        const anchorImage = state.images[index + 1] || state.images[index - 1] || null;
        const anchorItem = state.layout?.items.find((item) => item.image === anchorImage);
        const anchorLeft = anchorItem ? state.translateX + anchorItem.x * zoom : null;
        const anchorTop = anchorItem ? state.translateY + anchorItem.y * zoom : null;
        const [removed] = state.images.splice(index, 1);
        if (state.referenceImage === removed) state.referenceImage = state.images[0] || null;
        URL.revokeObjectURL(removed.url);

        if (!state.images.length) {
          clearImages();
          announce("Image removed.");
          return;
        }

        renderLayout({ recenter: false });
        state.zoom = zoom;
        if (state.images.length === 1) {
          centerContent();
        } else {
          const nextAnchorItem = state.layout.items.find((item) => item.image === anchorImage);
          if (nextAnchorItem && anchorLeft !== null && anchorTop !== null) {
            state.translateX = anchorLeft - nextAnchorItem.x * state.zoom;
            state.translateY = anchorTop - nextAnchorItem.y * state.zoom;
          }
          clampTranslation();
        }
        updatePreservedZoomModes(wasFitted, wasDefaultZoom);
        applyTransform();
        updateControls();
        announce(`Image ${index + 1} removed.`);
      }

      function getReorderInsertionIndex(fromIndex, targetIndex, placeAfter) {
        let insertionIndex = targetIndex + (placeAfter ? 1 : 0);
        if (fromIndex < insertionIndex) insertionIndex -= 1;
        return insertionIndex;
      }

      function reorderImage(fromIndex, targetIndex, placeAfter) {
        if (
          document.fullscreenElement ||
          state.images.length < 2 ||
          !state.images[fromIndex] ||
          !state.images[targetIndex]
        ) {
          return;
        }

        const insertionIndex = getReorderInsertionIndex(fromIndex, targetIndex, placeAfter);
        const translateX = state.translateX;
        const translateY = state.translateY;
        const [moved] = state.images.splice(fromIndex, 1);
        state.images.splice(insertionIndex, 0, moved);

        if (insertionIndex === fromIndex) return;
        renderLayout({ recenter: false });
        state.translateX = translateX;
        state.translateY = translateY;
        clampTranslation();
        applyTransform();
        updateControls();
        announce(`Image moved to position ${insertionIndex + 1}.`);
      }

      function reorderImages(reorder, message) {
        if (!state.layout || state.images.length < 2 || document.fullscreenElement) return;
        if (state.readingMode) {
          reorder();
          state.readingPage = 0;
          renderLayout({ recenter: false });
          resetReadingView();
          announce(`${message}. Reading starts from page 1.`);
          return;
        }
        const horizontal = state.orientation === "horizontal";
        const viewportCenter = horizontal ? window.innerWidth / 2 : window.innerHeight / 2;
        const anchorItem = state.layout.items.reduce((nearest, item) => {
          const rect = getDisplayedItemRect(item);
          const center = horizontal ? (rect.left + rect.right) / 2 : (rect.top + rect.bottom) / 2;
          if (!nearest || Math.abs(center - viewportCenter) < nearest.distance) {
            return { item, distance: Math.abs(center - viewportCenter) };
          }
          return nearest;
        }, null).item;
        const anchorLeft = state.translateX + anchorItem.x * state.zoom;
        const anchorTop = state.translateY + anchorItem.y * state.zoom;
        const anchorImage = anchorItem.image;

        reorder();
        renderLayout({ recenter: false });
        const reorderedAnchorItem = state.layout.items.find((item) => item.image === anchorImage);
        state.translateX = anchorLeft - reorderedAnchorItem.x * state.zoom;
        state.translateY = anchorTop - reorderedAnchorItem.y * state.zoom;
        clampTranslation({ centerCrossAxis: false });
        applyTransform();
        updateControls();
        announce(`${message}.`);
      }

      function sortImagesByName() {
        reorderImages(
          () => state.images.sort((left, right) => fileNameCollator.compare(left.name, right.name)),
          "Images sorted by name",
        );
      }

      function sortImagesByLastModified() {
        reorderImages(
          () => state.images.sort((left, right) => right.file.lastModified - left.file.lastModified),
          "Images sorted by last modified date, newest first",
        );
      }

      function reverseImageOrder() {
        reorderImages(() => state.images.reverse(), "Image order reversed");
      }

      function closeOrderMenu() {
        orderMenuControl.classList.remove("is-open");
        orderMenuBtn.setAttribute("aria-expanded", "false");
      }

      function toggleOrderMenu() {
        const isOpen = orderMenuControl.classList.toggle("is-open");
        orderMenuBtn.setAttribute("aria-expanded", String(isOpen));
      }

      async function replaceAllImages(fileList) {
        const files = getImageFiles(fileList);
        if (!files.length) return;

        const decoded = await decodeFiles(files);
        if (!decoded.length) {
          announce("The selected images could not be opened.");
          return;
        }

        const previousImages = state.images;
        const previousView = state.readingMode ? state.beforeReading : null;
        const progress = previousView?.progress ?? getScrollProgress();
        const orientation = state.orientation;
        const zoom = previousView?.zoom ?? state.zoom;
        const fitted = previousView?.fitted ?? state.fitted;
        const defaultZoom = previousView?.defaultZoom ?? state.defaultZoom;

        state.images = decoded;
        state.referenceImage = decoded[0];
        state.readingMode = false;
        state.readingSpread = true;
        state.readingOffset = false;
        state.readingPage = 0;
        state.beforeReading = null;
        state.orientation = orientation;
        state.zoom = zoom;
        state.fitted = fitted;
        state.defaultZoom = defaultZoom;
        renderLayout({ recenter: false });
        updatePreservedZoomModes(fitted, defaultZoom);
        setScrollProgress(progress);
        applyTransform();
        updateControls();
        for (const image of previousImages) URL.revokeObjectURL(image.url);
        announce(`${decoded.length} image${decoded.length === 1 ? "" : "s"} opened.`);
      }

      function getFitZoom() {
        if (!state.layout) return 1;
        if (state.readingMode) return getReadingFitZoom();
        const horizontal = getLayoutOrientation() === "horizontal";
        return Math.max(
          MIN_ZOOM,
          horizontal ? window.innerHeight / state.layout.height : window.innerWidth / state.layout.width,
        );
      }

      function fitToScreen() {
        if (!state.layout) return;
        stopPanMomentum();
        if (state.readingMode) {
          resetReadingView();
          return;
        }
        const progress = getScrollProgress();
        if (state.fitted) {
          state.zoom = getDefaultZoom();
          state.fitted = false;
          state.defaultZoom = true;
        } else {
          state.zoom = getFitZoom();
          state.fitted = true;
          state.defaultZoom = false;
        }
        setScrollProgress(progress);
        applyTransform();
        updateControls();
      }

      function fitFullscreenCrossAxis(progress = getScrollProgress()) {
        if (!state.layout) return;
        state.zoom = getFitZoom();
        state.defaultZoom = false;
        state.fullscreenAutoFit = true;
        if (state.readingMode) centerContent({ fullViewport: true });
        else setScrollProgress(progress);
        applyTransform();
      }

      function setZoomAt(nextZoom, focus = null) {
        if (!state.layout) return;
        stopPanMomentum();
        const progress = getScrollProgress();
        const fitZoom = getFitZoom();
        const currentZoom = state.zoom;
        const contentX = focus?.contentX ?? (focus ? (focus.clientX - state.translateX) / currentZoom : 0);
        const contentY = focus?.contentY ?? (focus ? (focus.clientY - state.translateY) / currentZoom : 0);
        const maximumZoom = Math.max(getDefaultZoom() * MAX_ZOOM, fitZoom);
        let zoom = Math.max(getMinimumZoom(), Math.min(maximumZoom, nextZoom));
        const atFit = isZoomClose(currentZoom, fitZoom);
        const reachesFit = isZoomClose(zoom, fitZoom);
        const crossesFit = (currentZoom < fitZoom && zoom > fitZoom) || (currentZoom > fitZoom && zoom < fitZoom);
        if (!atFit && (reachesFit || crossesFit)) zoom = fitZoom;
        state.zoom = zoom;
        state.fitted = isZoomClose(zoom, fitZoom);
        state.defaultZoom = false;
        state.fullscreenAutoFit = false;
        if (focus) {
          state.translateX = focus.clientX - contentX * zoom;
          state.translateY = focus.clientY - contentY * zoom;
          clampTranslation({ centerCrossAxis: !state.readingMode });
        } else if (state.readingMode) centerContent({ fullViewport: true });
        else setScrollProgress(progress);
        applyTransform();
        updateControls();
      }

      function getDisplayedItemRect(item) {
        return {
          left: state.translateX + item.x * state.zoom,
          top: state.translateY + item.y * state.zoom,
          right: state.translateX + (item.x + item.width) * state.zoom,
          bottom: state.translateY + (item.y + item.height) * state.zoom,
        };
      }

      function hideInsertButton() {
        state.insertHover = null;
        if (document.activeElement === insertBtn) insertBtn.blur();
        insertBtn.classList.remove("is-visible");
        delete insertBtn.dataset.index;
      }

      function usesTouchInsertion() {
        return touchInsertionQuery.matches;
      }

      function updateTouchInsertButtons() {
        const fitZoom = state.layout ? getFitZoom() : 1;
        if (
          !usesTouchInsertion() ||
          !state.layout ||
          state.images.length < 2 ||
          state.readingMode ||
          state.zoom > fitZoom ||
          isZoomClose(state.zoom, fitZoom)
        ) {
          hideInsertButton();
          touchInsertControls.replaceChildren();
          return;
        }
        const horizontal = getLayoutOrientation() === "horizontal";
        const buttons = new Map(Array.from(touchInsertControls.children, (button) => [button.dataset.index, button]));
        const visibleIndices = new Set();
        for (let index = 1; index < state.layout.items.length; index += 1) {
          const previous = getDisplayedItemRect(state.layout.items[index - 1]);
          const next = getDisplayedItemRect(state.layout.items[index]);
          const boundary = horizontal ? (previous.right + next.left) / 2 : (previous.bottom + next.top) / 2;
          const crossStart = horizontal ? Math.max(previous.top, next.top) : Math.max(previous.left, next.left);
          const crossEnd = horizontal ? Math.min(previous.bottom, next.bottom) : Math.min(previous.right, next.right);
          const crossCenter = (crossStart + crossEnd) / 2;
          const inViewport = horizontal
            ? boundary >= 0 && boundary <= window.innerWidth && crossCenter >= 0 && crossCenter <= window.innerHeight
            : boundary >= 0 && boundary <= window.innerHeight && crossCenter >= 0 && crossCenter <= window.innerWidth;
          if (!inViewport) continue;
          const key = String(index);
          visibleIndices.add(key);
          let button = buttons.get(key);
          if (!button) {
            button = insertBtn.cloneNode(true);
            button.removeAttribute("id");
            button.className = "touch-insert-btn";
            button.dataset.index = key;
            touchInsertControls.append(button);
          }
          const left = horizontal ? boundary : Math.max(24, Math.min(window.innerWidth - 24, crossCenter));
          const top = horizontal ? Math.max(24, Math.min(window.innerHeight - 24, crossCenter)) : boundary;
          button.style.left = `${left}px`;
          button.style.top = `${top}px`;
        }
        for (const [index, button] of buttons) {
          if (!visibleIndices.has(index)) button.remove();
        }
        state.insertHover = null;
        insertBtn.classList.remove("is-visible");
      }

      function updateInsertButton(clientX, clientY) {
        if (usesTouchInsertion()) {
          updateTouchInsertButtons();
          return;
        }
        if (
          !state.layout ||
          state.images.length < 2 ||
          document.fullscreenElement ||
          state.pan ||
          state.reorder?.active ||
          state.autoScroll?.mode === "external"
        ) {
          hideInsertButton();
          return;
        }

        const horizontal = state.orientation === "horizontal";
        let nearest = null;
        for (let index = 1; index < state.layout.items.length; index += 1) {
          const previous = getDisplayedItemRect(state.layout.items[index - 1]);
          const next = getDisplayedItemRect(state.layout.items[index]);
          const boundary = horizontal ? (previous.right + next.left) / 2 : (previous.bottom + next.top) / 2;
          const crossStart = horizontal ? Math.max(previous.top, next.top) : Math.max(previous.left, next.left);
          const crossEnd = horizontal ? Math.min(previous.bottom, next.bottom) : Math.min(previous.right, next.right);
          const crossCenter = (crossStart + crossEnd) / 2;
          const crossRadius = (crossEnd - crossStart) / 4;
          const coordinate = horizontal ? clientX : clientY;
          const crossCoordinate = horizontal ? clientY : clientX;
          const distance = Math.abs(coordinate - boundary);
          if (
            crossCoordinate >= crossCenter - crossRadius &&
            crossCoordinate <= crossCenter + crossRadius &&
            distance <= INSERT_HOVER_DISTANCE &&
            (!nearest || distance < nearest.distance)
          ) {
            nearest = {
              index,
              distance,
              left: horizontal ? boundary : crossCenter,
              top: horizontal ? crossCenter : boundary,
            };
          }
        }

        if (!nearest) {
          hideInsertButton();
          return;
        }
        state.insertHover = { clientX, clientY, index: nearest.index };
        insertBtn.dataset.index = String(nearest.index);
        insertBtn.style.left = `${nearest.left}px`;
        insertBtn.style.top = `${nearest.top}px`;
        insertBtn.classList.add("is-visible");
      }

      function getReferenceRect(item) {
        const rect = getDisplayedItemRect(item);
        const centerX = (rect.left + rect.right) / 2;
        const centerY = (rect.top + rect.bottom) / 2;
        const halfWidth = Math.min((rect.right - rect.left) / 2, DROP_REFERENCE_SIZE / 2);
        const halfHeight = Math.min((rect.bottom - rect.top) / 2, DROP_REFERENCE_SIZE / 2);
        return {
          left: centerX - halfWidth,
          right: centerX + halfWidth,
          top: centerY - halfHeight,
          bottom: centerY + halfHeight,
        };
      }

      function makeRect(left, top, right, bottom) {
        return {
          left,
          top,
          width: Math.max(0, right - left),
          height: Math.max(0, bottom - top),
        };
      }

      function setElementRect(element, rect) {
        element.style.left = `${rect.left}px`;
        element.style.top = `${rect.top}px`;
        element.style.width = `${rect.width}px`;
        element.style.height = `${rect.height}px`;
      }

      function setAddGeometry(element, rect) {
        setElementRect(element, rect);
        element.style.setProperty("--add-left", `${rect.addLeft}px`);
        element.style.setProperty("--add-top", `${rect.addTop}px`);
      }

      function getInitialBaseRect() {
        const size = getDefaultDisplaySize();
        const left = (window.innerWidth - size) / 2;
        const top = (window.innerHeight - size) / 2;
        return { left, top, right: left + size, bottom: top + size, width: size, height: size };
      }

      function positionInitialDrop(direction) {
        const axis = getDirectionAxis(direction);
        if (!axis) {
          initialDrop.removeAttribute("style");
          return;
        }
        const rect = getInitialBaseRect();
        const horizontal = axis === "horizontal";
        const vertical = axis === "vertical";
        initialDrop.style.left = horizontal ? "0" : `${rect.left}px`;
        initialDrop.style.top = vertical ? "0" : `${rect.top}px`;
        initialDrop.style.width = horizontal ? "100vw" : `${rect.width}px`;
        initialDrop.style.height = vertical ? "100vh" : `${rect.height}px`;
        initialDrop.style.aspectRatio = horizontal || vertical ? "auto" : "1";
        initialDrop.style.transform = horizontal || vertical ? "none" : "translate(-50%, -50%)";
      }

      function getAdditionGeometry(direction) {
        const firstDisplayed = state.images.length ? getDisplayedItemRect(state.layout.items[0]) : getInitialBaseRect();
        const lastDisplayed = state.images.length
          ? getDisplayedItemRect(state.layout.items[state.layout.items.length - 1])
          : firstDisplayed;
        const initial = !state.images.length;
        const outerLeft = initial ? Math.max(0, firstDisplayed.left - MIN_END_MARGIN) : 0;
        const outerRight = initial
          ? Math.min(window.innerWidth, lastDisplayed.right + MIN_END_MARGIN)
          : window.innerWidth;
        const outerTop = initial ? Math.max(0, firstDisplayed.top - MIN_END_MARGIN) : 0;
        const outerBottom = initial
          ? Math.min(window.innerHeight, lastDisplayed.bottom + MIN_END_MARGIN)
          : window.innerHeight;
        let rect;
        let addX;
        let addY;

        if (direction === "left") {
          rect = makeRect(outerLeft, firstDisplayed.top, firstDisplayed.left, firstDisplayed.bottom);
          addX = firstDisplayed.left - ADD_CONTROL_OFFSET;
          addY = (firstDisplayed.top + firstDisplayed.bottom) / 2;
        } else if (direction === "right") {
          rect = makeRect(lastDisplayed.right, lastDisplayed.top, outerRight, lastDisplayed.bottom);
          addX = lastDisplayed.right + ADD_CONTROL_OFFSET;
          addY = (lastDisplayed.top + lastDisplayed.bottom) / 2;
        } else if (direction === "top") {
          rect = makeRect(firstDisplayed.left, outerTop, firstDisplayed.right, firstDisplayed.top);
          addX = (firstDisplayed.left + firstDisplayed.right) / 2;
          addY = firstDisplayed.top - ADD_CONTROL_OFFSET;
        } else {
          rect = makeRect(lastDisplayed.left, lastDisplayed.bottom, lastDisplayed.right, outerBottom);
          addX = (lastDisplayed.left + lastDisplayed.right) / 2;
          addY = lastDisplayed.bottom + ADD_CONTROL_OFFSET;
        }

        return {
          ...rect,
          addLeft: addX - rect.left,
          addTop: addY - rect.top,
        };
      }

      function canAddInDirection(direction) {
        if (state.images.length < 2) return true;
        return getDirectionAxis(direction) === state.orientation;
      }

      function updateAddControls() {
        if (state.readingMode) {
          for (const button of addButtons) button.hidden = true;
          return;
        }
        for (const button of addButtons) {
          const direction = button.dataset.direction;
          if (!canAddInDirection(direction)) {
            button.hidden = true;
            continue;
          }
          const rect = getAdditionGeometry(direction);
          button.hidden = rect.width < 1 || rect.height < 1;
          if (button.hidden) continue;
          setAddGeometry(button, rect);
        }
      }

      function getDropDirection(clientX, clientY) {
        if (state.readingMode) return null;
        if (!state.images.length) {
          const rect = getInitialBaseRect();
          if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
            return "initial";
          }
          if (clientY >= rect.top && clientY <= rect.bottom && clientX < rect.left) return "left";
          if (clientY >= rect.top && clientY <= rect.bottom && clientX > rect.right) return "right";
          if (clientX >= rect.left && clientX <= rect.right && clientY < rect.top) return "top";
          if (clientX >= rect.left && clientX <= rect.right && clientY > rect.bottom) return "bottom";
          return null;
        }

        const first = getReferenceRect(state.layout.items[0]);
        const last = getReferenceRect(state.layout.items[state.layout.items.length - 1]);
